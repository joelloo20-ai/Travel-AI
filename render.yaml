services:
  - type: web
    name: wayfare
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VITE_APPS_SCRIPT_URL
        sync: false
      - key: VITE_APPS_SCRIPT_SHARED_SECRET
        sync: false
      - key: NODE_ENV
        value: production
